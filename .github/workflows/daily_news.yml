name: Cyber Learning Content Queue

on:
  schedule:
    # Runs Monday, Wednesday, and Friday at 7:00 AM IST (1:30 AM UTC).
    - cron: '30 1 * * 1,3,5'
  # Allows you to run the workflow manually from the GitHub Actions tab
  workflow_dispatch:

# Prevent multiple runs from racing each other and causing push conflicts
concurrency:
  group: content-queue
  cancel-in-progress: false

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so git pull --rebase works cleanly
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect optional current-event context
        run: python fetch_news.py

      - name: Create LinkedIn Content Queue
        run: python create_content_queue.py

      - name: Pull latest changes before committing
        run: git pull --rebase --autostash origin main

      - name: Commit Updated News File
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Create LinkedIn content queue"
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
